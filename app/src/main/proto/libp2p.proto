syntax = "proto3";

package com.github.ruediste.p2psync.proto;

enum KeyType {
	RSA = 0;
	Ed25519 = 1;
	Secp256k1 = 2;
	ECDSA = 3;
	Curve25519 = 4;
}

message PublicKey {
	KeyType type = 1;
	bytes data = 2;
}

message PrivateKey {
	KeyType type = 1;
	bytes data = 2;
}

message KeyPair {
	KeyType type = 1;
	bytes privateKey = 2;
	bytes publicKey = 3;
}
