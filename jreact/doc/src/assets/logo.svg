<svg width="315px" height="283.5px" viewBox="-10.5 -9.45 21 18.9" fill="none"
  xmlns="http://www.w3.org/2000/svg"
  class="w-24 lg:w-28 self-center text-sm me-0 flex origin-center transition-all ease-in-out">
  <!-- React Orbits with Dual-Tone Color Scheme -->
  <g stroke-width="1" fill="none">
    <!-- Horizontal Orbit (Electric Blue) -->
    <ellipse rx="10" ry="4" stroke="#007ACC" />
    <!-- +60° Orbit (Vibrant Orange) -->
    <ellipse rx="10" ry="4" transform="rotate(60)" stroke="#FF7A00" />
    <!-- +120° Orbit (Cyan / Blue Accent) -->
    <ellipse rx="10" ry="4" transform="rotate(120)" stroke="#00A2FF" />
  </g>

  <!-- J-Shaped White Backdrop / Stroke Outline -->
  <g transform="scale(4) translate(0.08, -0.02)">
    <path
      d="M 0.5 -1.25 H 0.85 V 0.55 C 0.85 1.25 0.35 1.6 -0.3 1.6 C -0.8 1.6 -1.2 1.3 -1.3 0.8 L -0.75 0.65 C -0.7 0.95 -0.5 1.15 -0.25 1.15 C 0.15 1.15 0.3 0.9 0.3 0.5 V -1.25 H 0.5 Z"
      stroke="#FFFFFF" stroke-width="0.35" stroke-linejoin="round" stroke-linecap="round"
      fill="#FFFFFF" />
  </g>

  <!-- Sharp Foreground "J" (Matching the primary electric blue) -->
  <g transform="scale(4) translate(0.08, -0.02)">
    <path
      d="M 0.5 -1.25 H 0.85 V 0.55 C 0.85 1.25 0.35 1.6 -0.3 1.6 C -0.8 1.6 -1.2 1.3 -1.3 0.8 L -0.75 0.65 C -0.7 0.95 -0.5 1.15 -0.25 1.15 C 0.15 1.15 0.3 0.9 0.3 0.5 V -1.25 H 0.5 Z"
      fill="#007ABB" />
  </g>
</svg>