syntax = "proto3";

package com.github.ruediste.p2psync.proto;
import "libp2p.proto";

message NodeUserConfiguration {
	bytes storageKey = 1;

	optional bytes dataKey = 5;
	optional PrivateKey DataSigningKeyPrivate = 6;

	// this is also the user id
	PublicKey DataSigningKeyPublic = 7;
}

// <<xxx, yyy>> means: encrypted with xxx-key (symmetric), signed with yyy-key

// <<storage, data>>

// <<storage, data>>

// <<storage, data>>

// Data Structures

message Contact {
	bytes contactId = 1;
	bytes userId = 2;
	string firstName = 3;
	string lastName = 4;
	string email = 5;
	string phone = 6;
	string notes = 7;
}

enum ContactField {
	CONTACT_FIELD_UNSPECIFIED = 0;
	CONTACT_FIELD_USER_ID = 1;
	CONTACT_FIELD_FIRST_NAME = 2;
	CONTACT_FIELD_LAST_NAME = 3;
	CONTACT_FIELD_EMAIL = 4;
	CONTACT_FIELD_PHONE = 5;
	CONTACT_FIELD_NOTES = 6;
}

message UserSnapshot {
	bytes fileTreeState = 1;
	repeated Contact contacts = 2;
	uint64 fileTreeRootOffset = 3;
}

message UserTreeState {
	bytes rootId = 1;
	string statusMessage = 2;
	repeated UserTreeEntry entries = 3;
}

message UserTreeEntry {
	bytes entityId = 1;
	bytes parentId = 2;
	string name = 3;
	bool directory = 4;
	bytes content = 5;
}

message VectorClock{
	map<int32,int64> values=1;
}

message UserOperation {
	enum Kind {
		SET_STATUS = 0;
		CREATE_DIRECTORY = 1;
		CREATE_FILE = 2;
		WRITE_FILE = 3;
		TRUNCATE_FILE = 4;
		MOVE = 5;
		RENAME = 6;
		DELETE = 7;
		DIRECT_MESSAGE = 8;
		PARTICIPATE_SYNC_UNIT = 9;
		LEAVE_SYNC_UNIT = 10;
		RECEIVE_MESSAGE = 11;
		CONTACT_CREATE = 12;
		CONTACT_UPDATE = 13;
		CONTACT_DELETE = 14;
		SET_SHARED_FOLDER_LABEL = 15;
	}
	Kind kind = 1;
	bytes entityId = 2;
	bytes parentId = 3;
	string name = 4;
	bytes newParentId = 5;
	string newName = 6;
	uint64 offset = 7;
	bytes data = 8;
	uint64 size = 9;
	string statusMessage = 10;
	string messageId = 11;
	bytes recipientUserId = 12;
	bytes messagePayload = 13;
	bytes syncUnitId = 14;
	bytes originalOperationPayload = 15;
	bytes originalOperationSignature = 16;
	uint64 originalOperationLamportClock = 17;
	bytes originalOperationNodeHash = 18;
	Contact contact = 19;
	ContactField contactField = 20;
	string contactValue = 21;
	bytes contactUserId = 22;
	bytes contactId = 23;
}

message NodeState {
	bytes peerId = 1;
	uint64 clock = 2;
	reserved 3;
	repeated NodeUserState users = 4;
	bytes peerPrivateKey = 5;
	repeated PersistedSyncUnit syncUnits = 6;
	uint64 sharedFolderNextNodeId = 7;
}

message UserCredential {
	bytes ciphertext = 1;
	bytes salt = 2;
	bytes iv = 3;
}

message SharedFolderLabel {
	bytes syncUnitId = 1;
	string label = 2;
}

message NodeUserState {
	bytes userPrivateKey = 1;
	reserved 2, 3;
	string localName = 4;
	bytes rootDirectoryGuid = 6;
	repeated OperationClock maxOperationClock = 10;
	ActiveNodeSetState activeNodeSet = 11;
	repeated PartialOperationState retrievalTree = 12;
	bytes snapshotState = 13;
	repeated bytes participatingSyncUnitIds = 14;
	repeated string deliveredMessageIds = 15;
	repeated StoredUserMessage inboxMessages = 16;
	uint64 nextNodeId = 17;
	uint64 clock = 18;
	uint64 entityCounter = 19;
	bytes homeSyncUnitId = 20;
	repeated SharedFolderLabel sharedFolderLabels = 21;
}

message UserMessage {
	enum Type {
		CHAT = 0;
		MAIL = 1;
		SHARED_FOLDER_INVITATION = 2;
		MESSAGE_CHANNEL_INVITATION = 3;
		TODO_LIST_INVITATION = 4;
	}
	string messageId = 1;
	bytes senderUserId = 2;
	bytes recipientUserId = 3;
	Type type = 4;
	string subject = 5;
	string body = 6;
	repeated SyncUnitAttachment attachments = 7;
	bytes invitedSyncUnitId = 8;
	reserved 9;
}

message StoredUserMessage {
	bytes messageId = 1;
	bytes senderUserId = 2;
	uint64 lamportClock = 3;
	bytes nodeHash = 4;
	bytes operationPayload = 5;
	bytes signature = 6;
}

message PersistedSyncUnit {
	bytes id = 1;
	int32 type = 2;
	bytes creatorPublicKey = 3;
	repeated PersistedSyncUnitAuthorizationOperation authorizationOperations = 4;
	repeated PersistedSyncUnitContentOperation contentOperations = 5;
	uint64 clock = 6;
	uint64 entityCounter = 7;
	ActiveNodeSetState activeNodeSet = 8;
	bool home = 9;
	uint64 nextNodeId = 10;
	repeated PartialSyncUnitContentOperationState partialContentOperations = 11;
}

message PartialSyncUnitContentOperationState {
	bytes unitId = 1;
	uint64 lamportClock = 2;
	bytes nodeHash = 3;
	bytes authorPublicKey = 4;
	int32 kind = 5;
	string key = 6;
	uint32 totalLength = 7;
	bytes receivedBytes = 8;
	bytes signature = 9;
}

message PersistedSyncUnitAuthorizationOperation {
	bytes unitId = 1;
	uint64 lamportClock = 2;
	bytes nodeHash = 3;
	bytes authorPublicKey = 4;
	int32 action = 5;
	bytes subjectPublicKey = 6;
	int32 role = 7;
	bytes signature = 8;
}

message PersistedSyncUnitContentOperation {
	bytes unitId = 1;
	uint64 lamportClock = 2;
	bytes nodeHash = 3;
	bytes authorPublicKey = 4;
	int32 kind = 5;
	string key = 6;
	bytes payload = 7;
	bytes signature = 8;
}

message SyncUnitMessage {
	string text = 1;
	repeated SyncUnitAttachment attachments = 2;
}

message SyncUnitAttachment {
	string name = 1;
	string mediaType = 2;
	bytes content = 3;
}

message PersistedOperation {
	uint64 lamportClock = 1;
	bytes nodeHash = 2;
	bytes payload = 3;
	bytes signature = 4;
}

message OperationClock {
	string nodeId = 1;
	uint64 clock = 2;
}

message PartialOperationState {
	string sourceNodeId = 1;
	uint64 lamportClock = 2;
	bytes nodeHash = 3;
	uint32 totalLength = 4;
	bytes receivedBytes = 5;
	bytes signature = 6;
}

message ActiveNodeSetState {
	string versionNodeId = 1;
	uint64 versionClock = 2;
	repeated string nodeIds = 3;
	reserved 4;
	LeavingProcessState leavingProcess = 5;
	repeated string removedNodeIds = 6;
}

message LeavingProcessState {
	int32 phase = 1;
	string processId = 2;
	string leavingNodeId = 3;
	uint64 lastOperationClock = 4;
	string lastOperationClockSourceNode = 5;
	repeated string confirmedBy = 6;
}

message RemoteSyncRequest {
	bytes userId = 1;
	repeated OperationClock fromClock = 2;
	repeated OperationOffset offsets = 3;
	uint32 maxOperations = 4;
	uint32 byteBudget = 5;
	bool includeHistory = 6;
	string joiningNodeId = 7;
	RemoteDirectMessageDelivery directMessage = 8;
	bytes syncUnitId = 9;
	bytes requesterUserPublicKey = 10;
	PersistedSyncUnit syncUnitUpdate = 11;
	repeated SyncUnitContentOffset contentOffsets = 12;
	bytes requesterSignature = 13;
	bool userLookup = 14;
}

message SyncUnitContentOffset {
	string nodeId = 1;
	uint64 lamportClock = 2;
	uint32 offset = 3;
}

message RemoteDirectMessageDelivery {
	bytes senderUserId = 1;
	PersistedOperation operation = 2;
}

message OperationOffset {
	string nodeId = 1;
	uint32 offset = 2;
}

message RemoteOperationTransfer {
	uint64 lamportClock = 1;
	bytes nodeHash = 2;
	uint32 totalLength = 3;
	uint32 offset = 4;
	bytes bytes = 5;
	bytes signature = 6;
	bool complete = 7;
}

message RemoteSyncResponse {
	bool userFound = 1;
	reserved 2;
	repeated PersistedOperation history = 3;
	repeated OperationClock maxOperationClock = 4;
	ActiveNodeSetState activeNodeSet = 5;
	repeated RemoteOperationTransfer transfers = 6;
	uint64 nodeClock = 7;
	bool directMessageStored = 8;
	bool syncUnitFound = 9;
	PersistedSyncUnit syncUnit = 10;
	bool syncUnitRevoked = 11;
	bytes homeSyncUnitId = 12;
	repeated UserTreeEntry fileTreeEntries = 13;
	bytes fileTreeRootId = 14;
	string fileTreeStatus = 15;
	repeated RemoteSyncUnitContentTransfer contentTransfers = 16;
	repeated Contact contacts = 17;
}

message RemoteSyncUnitContentTransfer {
	bytes unitId = 1;
	uint64 lamportClock = 2;
	bytes nodeHash = 3;
	bytes authorPublicKey = 4;
	int32 kind = 5;
	string key = 6;
	uint32 totalLength = 7;
	uint32 offset = 8;
	bytes bytes = 9;
	bytes signature = 10;
	bool complete = 11;
}

