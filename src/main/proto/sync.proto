syntax = "proto3";

package com.github.ruediste.p2psync.proto;
import "libp2p.proto";

message NodeUserConfigurationProto {
	bytes storageKey = 1;

	optional bytes dataKey = 5;
	optional PrivateKeyProto DataSigningKeyPrivate = 6;

	// Key material; UserId is derived from these canonical public-key bytes.
	PublicKeyProto DataSigningKeyPublic = 7;
}

// <<xxx, yyy>> means: encrypted with xxx-key (symmetric), signed with yyy-key

// <<storage, data>>

// <<storage, data>>

// <<storage, data>>

// Data Structures

message ContactProto {
	bytes contactId = 1;
	bytes userId = 2;
	string firstName = 3;
	string lastName = 4;
	string email = 5;
	string phone = 6;
	string notes = 7;
}

enum ContactField {
	CONTACT_FIELD_UNSPECIFIED = 0;
	CONTACT_FIELD_USER_ID = 1;
	CONTACT_FIELD_FIRST_NAME = 2;
	CONTACT_FIELD_LAST_NAME = 3;
	CONTACT_FIELD_EMAIL = 4;
	CONTACT_FIELD_PHONE = 5;
	CONTACT_FIELD_NOTES = 6;
}

message UserSnapshotProto {
	bytes fileTreeState = 1;
	repeated ContactProto contacts = 2;
	uint64 fileTreeRootOffset = 3;
}

message UserTreeStateProto {
	bytes rootId = 1;
	string statusMessage = 2;
	repeated UserTreeEntryProto entries = 3;
}

message UserTreeEntryProto {
	bytes entityId = 1;
	bytes parentId = 2;
	string name = 3;
	bool directory = 4;
	bytes content = 5;
}

message VectorClockProto{
	map<int32,int64> values=1;
}

message UserOperationProto {
	enum Kind {
		SET_STATUS = 0;
		CREATE_DIRECTORY = 1;
		CREATE_FILE = 2;
		WRITE_FILE = 3;
		TRUNCATE_FILE = 4;
		MOVE = 5;
		RENAME = 6;
		DELETE = 7;
		DIRECT_MESSAGE = 8;
		PARTICIPATE_SYNC_UNIT = 9;
		LEAVE_SYNC_UNIT = 10;
		RECEIVE_MESSAGE = 11;
		CONTACT_CREATE = 12;
		CONTACT_UPDATE = 13;
		CONTACT_DELETE = 14;
		SET_SHARED_FOLDER_LABEL = 15;
	}
	Kind kind = 1;
	bytes entityId = 2;
	bytes parentId = 3;
	string name = 4;
	bytes newParentId = 5;
	string newName = 6;
	uint64 offset = 7;
	bytes data = 8;
	uint64 size = 9;
	string statusMessage = 10;
	string messageId = 11;
	bytes recipientUserId = 12;
	bytes messagePayload = 13;
	bytes syncUnitId = 14;
	bytes originalOperationPayload = 15;
	bytes originalOperationSignature = 16;
	uint64 originalOperationLamportClock = 17;
	bytes originalOperationNodeId = 18;
	ContactProto contact = 19;
	ContactField contactField = 20;
	string contactValue = 21;
	bytes contactUserId = 22;
	bytes contactId = 23;
	bytes originalOperationAuthorPublicKey = 24;
}

message NodeStateProto {
	bytes nodeId = 1;
	uint64 clock = 2;
	reserved 3;
	repeated NodeUserStateProto users = 4;
	bytes peerPrivateKey = 5;
	repeated PersistedSyncUnitProto syncUnits = 6;
	reserved 7;
}

message UserCredentialProto {
	bytes ciphertext = 1;
	bytes salt = 2;
	bytes iv = 3;
}

message SharedFolderLabelProto {
	bytes syncUnitId = 1;
	string label = 2;
}

message NodeUserStateProto {
	bytes userPrivateKey = 1;
	reserved 2, 3;
	string localName = 4;
	bytes rootDirectoryGuid = 6;
	repeated OperationClockProto maxOperationClock = 10;
	ActiveNodeSetStateProto activeNodeSet = 11;
	repeated PartialOperationStateProto retrievalTree = 12;
	bytes snapshotState = 13;
	repeated bytes participatingSyncUnitIds = 14;
	repeated string deliveredMessageIds = 15;
	repeated StoredUserMessageProto inboxMessages = 16;
	uint64 nextNodeId = 17;
	uint64 clock = 18;
	uint64 entityCounter = 19;
	bytes homeSyncUnitId = 20;
	repeated SharedFolderLabelProto sharedFolderLabels = 21;
}

message UserMessageProto {
	enum Type {
		CHAT = 0;
		MAIL = 1;
		SHARED_FOLDER_INVITATION = 2;
		MESSAGE_CHANNEL_INVITATION = 3;
		TODO_LIST_INVITATION = 4;
	}
	string messageId = 1;
	bytes senderUserId = 2;
	bytes recipientUserId = 3;
	Type type = 4;
	string subject = 5;
	string body = 6;
	repeated SyncUnitAttachmentProto attachments = 7;
	bytes invitedSyncUnitId = 8;
	reserved 9;
}

message StoredUserMessageProto {
	bytes messageId = 1;
	bytes senderUserId = 2;
	uint64 lamportClock = 3;
	bytes nodeId = 4;
	bytes operationPayload = 5;
	bytes signature = 6;
	bytes senderUserPublicKey = 7;
}

message PersistedSyncUnitProto {
	bytes id = 1;
	int32 type = 2;
	bytes creatorUserId = 3;
	reserved 4, 5;
	uint64 clock = 6;
	uint64 entityCounter = 7;
	ActiveNodeSetStateProto activeNodeSet = 8;
	bool home = 9;
	uint64 nextNodeId = 10;
	repeated PartialSyncUnitContentOperationStateProto partialContentOperations = 11;
	PersistedSyncUnitAuthorizationOperationProto authorizationOperation = 12;
}

message PartialSyncUnitContentOperationStateProto {
	bytes unitId = 1;
	uint64 lamportClock = 2;
	bytes nodeId = 3;
	bytes authorPublicKey = 4;
	int32 kind = 5;
	string key = 6;
	uint32 totalLength = 7;
	bytes receivedBytes = 8;
	bytes signature = 9;
}

message PersistedSyncUnitAuthorizationOperationProto {
	bytes unitId = 1;
	uint64 lamportClock = 2;
	bytes nodeId = 3;
	bytes authorPublicKey = 4;
	int32 action = 5;
	bytes subjectUserId = 6;
	int32 role = 7;
	bytes signature = 8;
}

message PersistedSyncUnitContentOperationProto {
	bytes unitId = 1;
	uint64 lamportClock = 2;
	bytes nodeId = 3;
	bytes authorPublicKey = 4;
	int32 kind = 5;
	string key = 6;
	bytes payload = 7;
	bytes signature = 8;
}

message SyncUnitMessageProto {
	string text = 1;
	repeated SyncUnitAttachmentProto attachments = 2;
}

message SyncUnitAttachmentProto {
	string name = 1;
	string mediaType = 2;
	bytes content = 3;
}

message PersistedOperationProto {
	uint64 lamportClock = 1;
	bytes nodeId = 2;
	bytes payload = 3;
	bytes signature = 4;
}

message OperationClockProto {
	string nodeId = 1;
	uint64 clock = 2;
}

message PartialOperationStateProto {
	string sourceNodeId = 1;
	uint64 lamportClock = 2;
	bytes nodeId = 3;
	uint32 totalLength = 4;
	bytes receivedBytes = 5;
	bytes signature = 6;
}

message ActiveNodeSetStateProto {
	bytes versionNodeId = 1;
	uint64 versionClock = 2;
	repeated bytes nodeIds = 3;
	reserved 4;
	LeavingProcessStateProto leavingProcess = 5;
	repeated bytes removedNodeIds = 6;
}

message LeavingProcessStateProto {
	int32 phase = 1;
	string processId = 2;
	bytes leavingNodeId = 3;
	uint64 lastOperationClock = 4;
	bytes lastOperationClockSourceNode = 5;
	repeated bytes confirmedBy = 6;
}

message RemoteSyncRequestProto {
	bytes userId = 1;
	repeated OperationClockProto fromClock = 2;
	repeated OperationOffsetProto offsets = 3;
	uint32 maxOperations = 4;
	uint32 byteBudget = 5;
	bool includeHistory = 6;
	string joiningNodeId = 7;
	RemoteDirectMessageDeliveryProto directMessage = 8;
	bytes syncUnitId = 9;
	bytes requesterUserPublicKey = 10;
	PersistedSyncUnitProto syncUnitUpdate = 11;
	repeated SyncUnitContentOffsetProto contentOffsets = 12;
	bytes requesterSignature = 13;
	bool userLookup = 14;
}

message SyncUnitContentOffsetProto {
	string nodeId = 1;
	uint64 lamportClock = 2;
	uint32 offset = 3;
}

message RemoteDirectMessageDeliveryProto {
	bytes senderUserId = 1;
	PersistedOperationProto operation = 2;
}

message OperationOffsetProto {
	string nodeId = 1;
	uint32 offset = 2;
}

message RemoteOperationTransferProto {
	uint64 lamportClock = 1;
	bytes nodeId = 2;
	uint32 totalLength = 3;
	uint32 offset = 4;
	bytes bytes = 5;
	bytes signature = 6;
	bool complete = 7;
}

message RemoteSyncResponseProto {
	bool userFound = 1;
	reserved 2, 6, 16;
	reserved 3;
	repeated OperationClockProto maxOperationClock = 4;
	ActiveNodeSetStateProto activeNodeSet = 5;
	uint64 nodeClock = 7;
	bool directMessageStored = 8;
	bool syncUnitFound = 9;
	PersistedSyncUnitProto syncUnit = 10;
	bool syncUnitRevoked = 11;
	bytes homeSyncUnitId = 12;
	repeated UserTreeEntryProto fileTreeEntries = 13;
	bytes fileTreeRootId = 14;
	string fileTreeStatus = 15;
	repeated ContactProto contacts = 17;
	RemoteOperationTransferProto transfer = 18;
	RemoteSyncUnitContentTransferProto contentTransfer = 19;
}

message RemoteSyncUnitContentTransferProto {
	bytes unitId = 1;
	uint64 lamportClock = 2;
	bytes nodeId = 3;
	bytes authorPublicKey = 4;
	int32 kind = 5;
	string key = 6;
	uint32 totalLength = 7;
	uint32 offset = 8;
	bytes bytes = 9;
	bytes signature = 10;
	bool complete = 11;
}

